# Rebuild the historical, Gate-A-passed RegulonDB TSS discovery subset from
# the re-fetched snapshot after verifying the source-file hashes.
input: data/interim/regulondb_metadata_20260930.tsv
output_dir: data/processed/m1_regulondb_tss_20260930
max_n_fraction: 0.1
validation_sources: []
background_methods:
  - mononucleotide
  - dinucleotide
background_replicates: 1
seed: 20260922
homology_clustering: true
identity_threshold: 0.90
kmer_size: 15
tss_window:
  upstream: 60
  downstream: 20
tss_column: tss_position
strand_column: strand
